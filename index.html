<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動く！スタンププレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #748db1;
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .no-scroll {
            overflow: hidden !important;
        }
        .stamp-item {
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .stamp-item:hover {
            transform: scale(1.05);
        }
        .stamp-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        /* 横4列固定・中央寄せの等間隔グリッド */
        #preview-area {
            display: grid;
            grid-template-columns: repeat(4, max-content);
            justify-content: center;
            align-content: center;
            gap: 16px;
            padding: 16px;
        }
    </style>
</head>
<body>

    <!-- コントロールパネル（左寄せでコンパクトにまとめる） -->
    <div class="bg-white p-4 shadow-md z-10 flex flex-wrap gap-4 items-center justify-start">
        
        <input type="file" id="file-input" multiple accept="image/png, image/apng, image/gif" class="text-sm">
        
        <button onclick="replayAll()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold shadow">
            ▶ 一斉再生
        </button>
        
        <div class="flex items-center bg-gray-100 px-3 py-1 rounded">
            <label class="flex items-center gap-1 text-sm font-bold cursor-pointer mr-2">
                <input type="checkbox" id="auto-loop" class="w-4 h-4"> 自動ループ
            </label>
            <input type="number" id="loop-interval" value="4.0" step="0.1" min="0.5" max="10.0" class="w-16 border rounded text-center text-sm font-bold py-1">
            <span class="text-sm font-bold ml-1">秒</span>
        </div>

        <!-- 区切り線 -->
        <div class="border-l-2 border-gray-300 h-6 mx-2 hidden sm:block"></div>

        <label class="flex items-center gap-2 text-sm font-bold cursor-pointer text-green-700">
            <input type="checkbox" id="fit-screen" checked class="w-4 h-4"> 1画面に収める(4列)
        </label>
        
        <div id="slider-container" class="flex items-center gap-2 opacity-50 pointer-events-none transition-opacity">
            <span class="text-sm font-bold">サイズ:</span>
            <input type="range" id="size-slider" min="50" max="300" value="120" class="w-24">
        </div>
    </div>

    <!-- スタンプ表示エリア -->
    <div id="preview-area" class="flex-1 overflow-auto no-scroll">
        <!-- ここにスタンプが追加されます -->
    </div>

    <!-- ポップアップ（拡大表示）用オーバーレイ -->
    <div id="popup-overlay" class="fixed inset-0 bg-black/60 hidden z-50 flex justify-center items-center cursor-pointer" onclick="closePopup()">
        <img id="popup-img" src="" alt="Popup" class="w-[300px] h-[300px] object-contain drop-shadow-2xl">
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewArea = document.getElementById('preview-area');
        const fitScreenCb = document.getElementById('fit-screen');
        const sizeSlider = document.getElementById('size-slider');
        const sliderContainer = document.getElementById('slider-container');
        const autoLoopCb = document.getElementById('auto-loop');
        const loopIntervalInput = document.getElementById('loop-interval');
        
        let loadedImages = [];
        let loopTimer = null;

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            
            previewArea.innerHTML = '';
            loadedImages = [];

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const src = event.target.result;
                    loadedImages.push(src);
                    
                    const div = document.createElement('div');
                    div.className = 'stamp-item';
                    div.onclick = () => showPopup(src);
                    
                    const img = document.createElement('img');
                    img.src = src;
                    div.appendChild(img);
                    
                    previewArea.appendChild(div);
                    
                    if(loadedImages.length === files.length){
                        adjustLayout();
                        if(autoLoopCb.checked) startLoop();
                    }
                };
                reader.readAsDataURL(file);
            });
        });

        fitScreenCb.addEventListener('change', (e) => {
            if(e.target.checked) {
                previewArea.classList.add('no-scroll');
                sliderContainer.classList.add('opacity-50', 'pointer-events-none');
            } else {
                previewArea.classList.remove('no-scroll');
                sliderContainer.classList.remove('opacity-50', 'pointer-events-none');
            }
            adjustLayout();
        });

        sizeSlider.addEventListener('input', () => {
            if(!fitScreenCb.checked) adjustLayout();
        });

        window.addEventListener('resize', adjustLayout);

        function adjustLayout() {
            const items = document.querySelectorAll('.stamp-item');
            if (items.length === 0) return;

            const cols = 4; 
            const gap = 16; 

            if (fitScreenCb.checked) {
                const W = previewArea.clientWidth - 32; 
                const H = previewArea.clientHeight - 32; 
                const rows = Math.ceil(items.length / cols); 

                let w = (W - (cols - 1) * gap) / cols;
                let h = (H - (rows - 1) * gap) / rows;
                let maxSize = Math.min(w, h);

                items.forEach(item => {
                    item.style.width = Math.floor(maxSize) + 'px';
                    item.style.height = Math.floor(maxSize) + 'px';
                });
            } else {
                const manualSize = sizeSlider.value;
                items.forEach(item => {
                    item.style.width = manualSize + 'px';
                    item.style.height = manualSize + 'px';
                });
            }
        }

        function replayAll() {
            const imgs = document.querySelectorAll('.stamp-item img');
            imgs.forEach(img => {
                const currentSrc = img.src;
                img.src = '';
                setTimeout(() => { img.src = currentSrc; }, 10);
            });
        }

        function startLoop() {
            if (loopTimer) clearInterval(loopTimer);
            let sec = parseFloat(loopIntervalInput.value);
            if (isNaN(sec) || sec <= 0) sec = 4.0;
            loopTimer = setInterval(replayAll, sec * 1000);
        }

        function stopLoop() {
            if (loopTimer) clearInterval(loopTimer);
            loopTimer = null;
        }

        autoLoopCb.addEventListener('change', (e) => {
            if (e.target.checked) {
                startLoop();
            } else {
                stopLoop();
            }
        });

        loopIntervalInput.addEventListener('change', () => {
            if (autoLoopCb.checked) {
                startLoop();
            }
        });

        function showPopup(src) {
            const overlay = document.getElementById('popup-overlay');
            const popupImg = document.getElementById('popup-img');
            popupImg.src = ''; 
            setTimeout(() => { popupImg.src = src; }, 10);
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        function closePopup() {
            const overlay = document.getElementById('popup-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            document.getElementById('popup-img').src = ''; 
        }
    </script>
</body>
</html>
