<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動く！スタンププレビュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #748db1; /* LINEのトーク背景色 */
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* スクロールバーの非表示（1画面フィット時） */
        .no-scroll {
            overflow: hidden !important;
        }
        .stamp-item {
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .stamp-item:hover {
            transform: scale(1.05);
        }
        .stamp-item img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            pointer-events: none; /* 画像自体のクリックイベントを防ぐ */
        }
    </style>
</head>
<body>

    <!-- コントロールパネル -->
    <div class="bg-white p-4 shadow-md z-10 flex flex-wrap gap-4 items-center justify-between">
        <div class="flex items-center gap-4">
            <input type="file" id="file-input" multiple accept="image/png, image/apng, image/gif" class="text-sm">
            
            <button onclick="replayAll()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold shadow">
                ▶ 一斉再生
            </button>
            
            <label class="flex items-center gap-2 text-sm font-bold cursor-pointer">
                <input type="checkbox" id="auto-loop" class="w-4 h-4"> 自動ループ(4秒)
            </label>
        </div>

        <div class="flex items-center gap-4 border-l pl-4">
            <label class="flex items-center gap-2 text-sm font-bold cursor-pointer text-green-700">
                <input type="checkbox" id="fit-screen" checked class="w-4 h-4"> 1画面に収める
            </label>
            
            <div id="slider-container" class="flex items-center gap-2 opacity-50 pointer-events-none transition-opacity">
                <span class="text-sm">サイズ:</span>
                <input type="range" id="size-slider" min="50" max="300" value="120" class="w-24">
            </div>
        </div>
    </div>

    <!-- スタンプ表示エリア -->
    <div id="preview-area" class="flex-1 p-4 overflow-auto flex flex-wrap content-start justify-center gap-2 no-scroll">
        <!-- ここにスタンプが追加されます -->
    </div>

    <!-- ポップアップ（拡大表示）用オーバーレイ -->
    <div id="popup-overlay" class="fixed inset-0 bg-black/60 hidden z-50 flex justify-center items-center cursor-pointer" onclick="closePopup()">
        <img id="popup-img" src="" alt="Popup" class="w-[300px] h-[300px] object-contain drop-shadow-2xl">
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewArea = document.getElementById('preview-area');
        const fitScreenCb = document.getElementById('fit-screen');
        const sizeSlider = document.getElementById('size-slider');
        const sliderContainer = document.getElementById('slider-container');
        
        let loadedImages = [];
        let loopInterval = null;

        // 画像の読み込み
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if(files.length === 0) return;
            
            previewArea.innerHTML = '';
            loadedImages = [];

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const src = event.target.result;
                    loadedImages.push(src);
                    
                    const div = document.createElement('div');
                    div.className = 'stamp-item';
                    div.onclick = () => showPopup(src);
                    
                    const img = document.createElement('img');
                    img.src = src;
                    div.appendChild(img);
                    
                    previewArea.appendChild(div);
                    
                    // すべて読み込み終わったらリサイズ処理
                    if(loadedImages.length === files.length){
                        adjustLayout();
                    }
                };
                reader.readAsDataURL(file);
            });
        });

        // 1画面フィット機能のオンオフ
        fitScreenCb.addEventListener('change', (e) => {
            if(e.target.checked) {
                previewArea.classList.add('no-scroll');
                sliderContainer.classList.add('opacity-50', 'pointer-events-none');
            } else {
                previewArea.classList.remove('no-scroll');
                sliderContainer.classList.remove('opacity-50', 'pointer-events-none');
            }
            adjustLayout();
        });

        // スライダーの手動調整
        sizeSlider.addEventListener('input', () => {
            if(!fitScreenCb.checked) adjustLayout();
        });

        // ウィンドウのサイズが変わった時も再計算
        window.addEventListener('resize', adjustLayout);

        // レイアウトの計算と適用
        function adjustLayout() {
            const items = document.querySelectorAll('.stamp-item');
            if (items.length === 0) return;

            if (fitScreenCb.checked) {
                // 1画面に収めるための最大サイズを計算 (ギャップ8pxを考慮)
                const W = previewArea.clientWidth - 32; // 余白分
                const H = previewArea.clientHeight - 32;
                const count = items.length;
                let maxSize = 0;

                for (let cols = 1; cols <= count; cols++) {
                    let rows = Math.ceil(count / cols);
                    let w = (W - (cols - 1) * 8) / cols;
                    let h = (H - (rows - 1) * 8) / rows;
                    let size = Math.min(w, h);
                    if (size > maxSize) maxSize = size;
                }
                
                items.forEach(item => {
                    item.style.width = Math.floor(maxSize) + 'px';
                    item.style.height = Math.floor(maxSize) + 'px';
                });
            } else {
                // スライダーの指定サイズを適用
                const manualSize = sizeSlider.value;
                items.forEach(item => {
                    item.style.width = manualSize + 'px';
                    item.style.height = manualSize + 'px';
                });
            }
        }

        // 一斉再生（APNGの再読み込みで最初から動かす）
        function replayAll() {
            const imgs = document.querySelectorAll('.stamp-item img');
            imgs.forEach(img => {
                const currentSrc = img.src;
                img.src = '';
                setTimeout(() => { img.src = currentSrc; }, 10);
            });
        }

        // 自動ループ機能
        document.getElementById('auto-loop').addEventListener('change', (e) => {
            if (e.target.checked) {
                loopInterval = setInterval(replayAll, 4000); // 4秒間隔
            } else {
                clearInterval(loopInterval);
            }
        });

        // クリックで拡大表示（ポップアップ）
        function showPopup(src) {
            const overlay = document.getElementById('popup-overlay');
            const popupImg = document.getElementById('popup-img');
            popupImg.src = ''; // 一度空にしてAPNGを最初から再生
            setTimeout(() => { popupImg.src = src; }, 10);
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
        }

        // 拡大表示を閉じる
        function closePopup() {
            const overlay = document.getElementById('popup-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            document.getElementById('popup-img').src = ''; 
        }
    </script>
</body>
</html>
